services:
  # ---- Backend API (Express) ----
  - type: web
    name: library-mgmt-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: GOOGLE_PROJECT_ID
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: STUDENT_ID_PREFIX
        value: LIB
      - key: RECEIPT_PREFIX
        value: RCPT
      - key: DEFAULT_CURRENCY
        value: INR
      # Render's Cron Job service has no free tier, so backups run
      # in-process instead. This only fires while the web service is
      # awake — pair it with a free external pinger (e.g. cron-job.org,
      # UptimeRobot) hitting /api/health every ~10 min to keep the free
      # instance from sleeping, so the 2am backup actually runs.
      - key: BACKUP_ENABLED
        value: "true"
      # Daily payment-due push reminders to students (mobile app). Off
      # until a Firebase project is set up — set PUSH_ENABLED=true and
      # fill in the FIREBASE_* values (a Firebase service account, not
      # the Google Sheets one above) once ready. Same sleeping-instance
      # caveat as BACKUP_ENABLED.
      - key: PUSH_ENABLED
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

  # ---- Frontend (static site) ----
  - type: web
    name: library-mgmt-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to https://<library-mgmt-backend>.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Render has no free tier for Cron Jobs, so the dedicated backup cron
  # service was removed. Backups now run in-process on the free web
  # service above (BACKUP_ENABLED=true) — see the note on that env var.
